# Containers do projeto. Uso, na raiz do repositório:  docker compose up -d --build
# Os valores vêm do arquivo .env da raiz (veja .env.example).
services:
  banco:
    image: postgres:15
    container_name: postgres_monitoramento_londrina
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-projeto_integrador}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./banco/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-projeto_integrador}"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Defina VITE_SUPABASE_URL no arquivo .env}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?Defina VITE_SUPABASE_ANON_KEY no arquivo .env}
    ports:
      - "127.0.0.1:5173:80"
    restart: unless-stopped

volumes:
  postgres_data:
